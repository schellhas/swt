<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('swt-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Test: 03 Die Welt der Softwaretechnik</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #777;
    --table-border: #ccc;
    --hint: #666;
    --q-correct-bg: #dcffe0;
    --q-correct-border: #4caf50;
    --q-wrong-bg: #ffe0e0;
    --q-wrong-border: #e53935;
    --answer-correct: #2e7d32;
  }
  [data-theme="dark"] {
    --bg: #181818;
    --fg: #e8e8e8;
    --muted: #9a9a9a;
    --table-border: #444;
    --hint: #999;
    --q-correct-bg: #1e3a24;
    --q-correct-border: #4caf50;
    --q-wrong-bg: #3a1e1e;
    --q-wrong-border: #e53935;
    --answer-correct: #7cd685;
  }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; max-width: 750px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  h1 { font-size: 1.3rem; }
  #theme-toggle { display: flex; justify-content: flex-end; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted); margin-bottom: 1rem; }
  .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #bbb; border-radius: 20px; cursor: pointer; transition: background .2s; }
  .switch .slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
  .switch input:checked + .slider { background: #555; }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .q { border: 1px solid var(--table-border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .q p.question { font-weight: bold; margin-top: 0; }
  .hint { font-weight: normal; font-size: 0.85rem; color: var(--hint); }
  label { display: block; margin: 0.3rem 0; cursor: pointer; }
  .q.correct { background: var(--q-correct-bg); border-color: var(--q-correct-border); }
  .q.wrong { background: var(--q-wrong-bg); border-color: var(--q-wrong-border); }
  .answer-correct { color: var(--answer-correct); font-weight: bold; }
  #controls { margin: 1.5rem 0; }
  button { padding: 0.5rem 1.2rem; font-size: 1rem; cursor: pointer; }
  #score { font-weight: bold; margin-left: 1rem; }
</style>
</head>
<body>
<div id="theme-toggle">
  <span>☀️</span>
  <label class="switch">
    <input type="checkbox" id="theme-checkbox" onchange="document.documentElement.setAttribute('data-theme', this.checked ? 'dark' : 'light'); localStorage.setItem('swt-theme', this.checked ? 'dark' : 'light');">
    <span class="slider"></span>
  </label>
  <span>🌙</span>
</div>
<script>document.getElementById('theme-checkbox').checked = document.documentElement.getAttribute('data-theme') === 'dark';</script>
<h1>Test: 03 Die Welt der Softwaretechnik</h1>
<form id="quiz"></form>
<div id="controls">
  <button type="button" onclick="check()">Auswerten</button>
  <button type="button" onclick="location.reload()">Neu mischen / Zurücksetzen</button>
  <span id="score"></span>
</div>

<script>
const questions = [
  {
    q: "1. Was ist laut Vincenti der Unterschied zwischen 'normalem' und 'radikalem' Vorgehen?",
    type: "single",
    options: [
      { t: "Normal = man weiß, wie es geht, kennt Erfolgsfaktoren und typische Risiken, darf zuversichtlich Erfolg erwarten. Radikal = man kennt nur grob, wie es geht, versteht nur teilweise, worauf es ankommt, und kennt die Probleme noch nicht.", correct: true },
      { t: "Normal bezieht sich nur auf kleine Projekte, radikal nur auf sehr große Projekte.", correct: false },
      { t: "Radikal bedeutet, dass ein Projekt garantiert scheitert; normal bedeutet garantierten Erfolg.", correct: false },
      { t: "Der Unterschied ist rein historisch und spielt in der modernen Softwaretechnik keine Rolle mehr.", correct: false }
    ]
  },
  {
    q: "2. Warum funktioniert Ingenieurwesen laut Vincenti nur zuverlässig, wenn man sich auf Erfahrung stützen kann?",
    type: "single",
    options: [
      { t: "Weil sich emergente Eigenschaften komplexer Systeme nicht allein durch Theorie vorhersagen lassen — Neues ist nur beherrschbar, wenn es Bekanntem genügend ähnelt.", correct: true },
      { t: "Weil Theorie in der Softwaretechnik grundsätzlich nutzlos ist.", correct: false },
      { t: "Weil Erfahrung gesetzlich vorgeschrieben ist.", correct: false },
      { t: "Weil neue Ansätze immer billiger sind als bewährte.", correct: false }
    ]
  },
  {
    q: "3. Was zeigt das Fallbeispiel der Tacoma Narrows Bridge (1940)?",
    type: "single",
    options: [
      { t: "Dass minderwertige Baumaterialien immer zum Einsturz von Brücken führen.", correct: false },
      { t: "Dass ein einziger radikaler Aspekt (hier: extreme Schlankheit) ein sonst normales, von einem Top-Experten geplantes Projekt zum Scheitern bringen kann — obwohl jedes Einzelteil korrekt dimensioniert war.", correct: true },
      { t: "Dass radikales Vorgehen in der Ingenieurpraxis grundsätzlich vermieden werden kann.", correct: false },
      { t: "Dass emergente Eigenschaften nur bei Software auftreten, nicht im klassischen Ingenieurwesen.", correct: false }
    ]
  },
  {
    q: "4. Was ist eine 'emergente Eigenschaft'?",
    type: "single",
    options: [
      { t: "Eine Eigenschaft, die jedes Einzelteil eines Systems separat besitzt.", correct: false },
      { t: "Ein Phänomen, das nicht aus den Einzelteilen, sondern erst aus deren Zusammenwirken verstehbar ist (z. B. die Längsschwingungen der Tacoma Narrows Bridge).", correct: true },
      { t: "Eine Eigenschaft, die nur in der Entwurfsphase, nie in der Implementierung auftritt.", correct: false },
      { t: "Ein Synonym für 'Bug'.", correct: false }
    ]
  },
  {
    q: "5. Sind ganze Projekte oder eher einzelne Aspekte 'normal' bzw. 'radikal'?",
    type: "single",
    options: [
      { t: "Immer das ganze Projekt als Einheit — es gibt keine gemischten Projekte.", correct: false },
      { t: "Einzelne Aspekte (Produktteile, Arbeitsschritte) sind normal oder radikal; kaum ein Projekt ist frei von radikalen Anteilen, aber ein 'normales' Projekt hat davon nur wenige und unbedeutende.", correct: true },
      { t: "Nur der Zeitplan eines Projekts kann radikal sein, niemals das Produkt selbst.", correct: false },
      { t: "Radikale Aspekte kommen ausschließlich in der Anforderungsphase vor.", correct: false }
    ]
  },
  {
    q: "6. Was besagt der 'Umkehrschluss', der laut Vorlesung NICHT gilt, wenn es um radikales Vorgehen und Innovation geht?",
    type: "single",
    options: [
      { t: "Dass innovative Projekte immer risikoarm sind.", correct: false },
      { t: "Dass viel radikales Vorgehen automatisch bedeutet, dass man etwas Innovatives tut — tatsächlich neigen Softwareentwickler:innen manchmal dazu, unnötig radikal vorzugehen (z. B. aus Lust an der Herausforderung).", correct: true },
      { t: "Dass normales Vorgehen niemals zu Innovation führen kann.", correct: false },
      { t: "Dass Wiederverwendung Innovation verhindert.", correct: false }
    ]
  },
  {
    q: "7. Was ist laut Vorlesung der wichtigste Ansatz für normales Vorgehen, und was ist sein Haupteffekt?",
    type: "single",
    options: [
      { t: "Automatisierung — ihr Haupteffekt ist Zeitersparnis.", correct: false },
      { t: "Wiederverwendung (von Komponenten, Entwürfen, Anforderungen, Prozesselementen, Werkzeugen) — sie senkt vor allem das Risiko, Kostensenkung ist nur ein willkommener Nebeneffekt.", correct: true },
      { t: "Abstraktion — ihr Haupteffekt ist eine höhere Innovationsrate.", correct: false },
      { t: "Projektmanagement — ihr Haupteffekt ist die Vermeidung radikalen Vorgehens.", correct: false }
    ]
  },
  {
    q: "8. Für wen ist radikales Vorgehen laut der pointierten Aussage der Vorlesung der 'einzige Weg', und wessen Domäne ist normales Vorgehen?",
    type: "single",
    options: [
      { t: "Radikales Vorgehen ist der einzige Weg für Anfänger (fehlende Erfahrung zwingt zu Neuland); normales Vorgehen ist die Domäne der Profis, deren Erfahrungswissen und Urteilskraft es ermöglicht, radikalem Vorgehen aus dem Weg zu gehen.", correct: true },
      { t: "Radikales Vorgehen ist ausschließlich für Profis geeignet, da nur sie die Risiken einschätzen können.", correct: false },
      { t: "Beide Vorgehensweisen sind für Anfänger und Profis gleichermaßen geeignet.", correct: false },
      { t: "Normales Vorgehen ist nur für sehr kleine Projekte relevant.", correct: false }
    ]
  },
  {
    q: "9. Wie ordnet die Taxonomie 'Die Welt der Softwaretechnik' die Problemwelt den beiden Lösungswelten zu?",
    type: "single",
    options: [
      { t: "Produktprobleme (Komplexität) werden vor allem mit technischen Ansätzen angegangen, Prozessprobleme (psycho-sozial) vor allem mit methodischen Ansätzen.", correct: true },
      { t: "Beide Problemarten werden ausschließlich mit technischen Ansätzen gelöst.", correct: false },
      { t: "Prozessprobleme werden nur mit Automatisierung gelöst, Produktprobleme nur mit Projektmanagement.", correct: false },
      { t: "Die Taxonomie trennt nicht zwischen Produkt- und Prozessproblemen.", correct: false }
    ]
  },
  {
    q: "10. Was macht ein System laut der Taxonomie 'komplex'?",
    type: "single",
    options: [
      { t: "Allein die reine Anzahl seiner Codezeilen.", correct: false },
      { t: "Es besteht aus vielen Teilen UND hat emergente Eigenschaften, die nicht aus den Einzelteilen, sondern erst aus deren Zusammenwirken verstehbar sind.", correct: true },
      { t: "Es wird von mehr als einer Person entwickelt.", correct: false },
      { t: "Es hat eine grafische Benutzeroberfläche.", correct: false }
    ]
  },
  {
    q: "11. Welche Ursachen für Prozessprobleme (psycho-sozial) werden genannt?",
    type: "multi",
    options: [
      { t: "Kognitive Beschränkungen (Arbeitsgedächtnis fasst nur ca. 7±2 Elemente)", correct: true },
      { t: "Gruppendynamik (z. B. Groupthink, selbsterfüllende Prophezeiungen)", correct: true },
      { t: "Verborgene Ziele (hidden agendas), die den Projektinteressen zuwiderlaufen können", correct: true },
      { t: "Fehlende Netzwerkbandbreite im Entwicklungsteam", correct: false }
    ]
  },
  {
    q: "12. Was ist mit 'Groupthink' als Beispiel für ein Gruppendynamik-Problem gemeint?",
    type: "single",
    options: [
      { t: "Ein Zustand, in dem kritische Fragen innerhalb der Gruppe nicht mehr gestellt werden.", correct: true },
      { t: "Wenn eine Gruppe schneller denkt als eine Einzelperson.", correct: false },
      { t: "Ein formales Brainstorming-Verfahren zur Ideenfindung.", correct: false },
      { t: "Ein Synonym für 'Pair Programming'.", correct: false }
    ]
  },
  {
    q: "13. Welche drei technischen ('harten') Lösungsansätze nennt die Taxonomie, und was zeichnet sie gemeinsam aus?",
    type: "single",
    options: [
      { t: "Abstraktion, Wiederverwendung, Automatisierung — sie lassen sich weit genug konkretisieren, um in Notationen/Werkzeuge überführt zu werden.", correct: true },
      { t: "Anforderungsermittlung, Entwurf, Qualitätssicherung — sie brauchen vor allem menschliche Urteilskraft.", correct: false },
      { t: "Projektmanagement, Kommunikation, Koordination — sie sind rein organisatorischer Natur.", correct: false },
      { t: "Testen, Debuggen, Refactoring — sie kommen nur in der Implementierungsphase vor.", correct: false }
    ]
  },
  {
    q: "14. Was ist laut Vorlesung 'die Hauptquelle von Produktivitätsverbesserungen' in der Softwaretechnik?",
    type: "single",
    options: [
      { t: "Automatisierung durch KI-Werkzeuge.", correct: false },
      { t: "Wiederverwendung — als Spezialfall von Abstraktion, bei dem nicht nur der Begriff, sondern auch die Details (Code, Anforderungen, Architekturen, Entwurfsmuster, Testfälle, ...) mehrfach genutzt werden.", correct: true },
      { t: "Größere Entwicklerteams.", correct: false },
      { t: "Radikales Vorgehen, weil es zu mehr Innovation führt.", correct: false }
    ]
  },
  {
    q: "15. Was unterscheidet laut Vorlesung ein 'Softwarewerkzeug' von einem 'Skript' im Rahmen von Automatisierung?",
    type: "single",
    options: [
      { t: "Ein Skript ist immer grafisch, ein Werkzeug immer textbasiert.", correct: false },
      { t: "Flexibel einsetzbare Automatisierung heißt Softwarewerkzeug, spezialisierte Automatisierung heißt Skript.", correct: true },
      { t: "Werkzeuge sind kommerziell, Skripte immer Open Source.", correct: false },
      { t: "Es gibt keinen Unterschied, beide Begriffe sind identisch definiert.", correct: false }
    ]
  },
  {
    q: "16. Welche vier Kategorien methodischer ('weicher') Ansätze werden genannt?",
    type: "multi",
    options: [
      { t: "Anforderungsermittlung", correct: true },
      { t: "Entwurf", correct: true },
      { t: "Qualitätssicherung", correct: true },
      { t: "Automatisierung", correct: false }
    ]
  }
];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const form = document.getElementById("quiz");
questions.forEach((item, qi) => {
  const div = document.createElement("div");
  div.className = "q";
  div.id = "q" + qi;
  const p = document.createElement("p");
  p.className = "question";
  p.textContent = item.q;
  if (item.type === "multi") {
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = " (mehrere Antworten möglich)";
    p.appendChild(hint);
  }
  div.appendChild(p);

  shuffle(item.options).forEach((opt, oi) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = item.type === "multi" ? "checkbox" : "radio";
    input.name = "q" + qi;
    input.value = oi;
    input.dataset.correct = opt.correct;
    label.appendChild(input);
    label.appendChild(document.createTextNode(" " + opt.t));
    div.appendChild(label);
  });

  form.appendChild(div);
});

function check() {
  let correctCount = 0;
  questions.forEach((item, qi) => {
    const div = document.getElementById("q" + qi);
    div.classList.remove("correct", "wrong");
    const inputs = [...div.querySelectorAll("input")];
    const allMatch = inputs.every(input => input.checked === (input.dataset.correct === "true"));
    div.querySelectorAll("label").forEach(l => {
      const input = l.querySelector("input");
      if (input.dataset.correct === "true") l.classList.add("answer-correct");
    });
    if (allMatch) {
      correctCount++;
      div.classList.add("correct");
    } else {
      div.classList.add("wrong");
    }
  });
  document.getElementById("score").textContent = `${correctCount} / ${questions.length} richtig`;
}
</script>
</body>
</html>
