<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('swt-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Test: 01 Einführung</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --h1-border: #333;
    --h2: #222;
    --muted: #777;
    --def-bg: #f3f3f3;
    --def-border: #888;
    --code-bg: #eee;
    --table-border: #ccc;
    --todo-bg: #fff3cd;
    --todo-border: #d4a017;
    --link: #1a4fa0;
    --hint: #666;
    --q-correct-bg: #dcffe0;
    --q-correct-border: #4caf50;
    --q-wrong-bg: #ffe0e0;
    --q-wrong-border: #e53935;
    --answer-correct: #2e7d32;
  }
  [data-theme="dark"] {
    --bg: #181818;
    --fg: #e8e8e8;
    --h1-border: #666;
    --h2: #ddd;
    --muted: #9a9a9a;
    --def-bg: #262626;
    --def-border: #777;
    --code-bg: #2e2e2e;
    --table-border: #444;
    --todo-bg: #4a3f14;
    --todo-border: #d4a017;
    --link: #7aa8ff;
    --hint: #999;
    --q-correct-bg: #1e3a24;
    --q-correct-border: #4caf50;
    --q-wrong-bg: #3a1e1e;
    --q-wrong-border: #e53935;
    --answer-correct: #7cd685;
  }
  body { background: var(--bg); color: var(--fg); }
  #theme-toggle { display: flex; justify-content: flex-end; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted); margin-bottom: 1rem; }
  .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #bbb; border-radius: 20px; cursor: pointer; transition: background .2s; }
  .switch .slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
  .switch input:checked + .slider { background: #555; }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  body { font-family: system-ui, sans-serif; max-width: 750px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  h1 { font-size: 1.3rem; }
  .q { border: 1px solid var(--table-border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .q p.question { font-weight: bold; margin-top: 0; }
  .hint { font-weight: normal; font-size: 0.85rem; color: var(--hint); }
  label { display: block; margin: 0.3rem 0; cursor: pointer; }
  .q.correct { background: var(--q-correct-bg); border-color: var(--q-correct-border); }
  .q.wrong { background: var(--q-wrong-bg); border-color: var(--q-wrong-border); }
  .answer-correct { color: var(--answer-correct); font-weight: bold; }
  #controls { margin: 1.5rem 0; }
  button { padding: 0.5rem 1.2rem; font-size: 1rem; cursor: pointer; }
  #score { font-weight: bold; margin-left: 1rem; }
</style>
</head>
<body>
<div id="theme-toggle">
  <span>☀️</span>
  <label class="switch">
    <input type="checkbox" id="theme-checkbox" onchange="document.documentElement.setAttribute('data-theme', this.checked ? 'dark' : 'light'); localStorage.setItem('swt-theme', this.checked ? 'dark' : 'light');">
    <span class="slider"></span>
  </label>
  <span>🌙</span>
</div>
<script>document.getElementById('theme-checkbox').checked = document.documentElement.getAttribute('data-theme') === 'dark';</script>
<h1>Test: 01 Einführung</h1>
<form id="quiz"></form>
<div id="controls">
  <button type="button" onclick="check()">Auswerten</button>
  <button type="button" onclick="location.reload()">Neu mischen / Zurücksetzen</button>
  <span id="score"></span>
</div>

<script>
const questions = [
  {
    q: "1. Welche sechs Aufgaben der Softwaretechnik gibt es laut Vorlesung?",
    type: "multi",
    options: [
      { t: "OB (Kosten/Nutzen-Analyse), WAS (Anforderungen), WIE (Entwurf)", correct: true },
      { t: "Bauen (Implementierung), Validieren (analytische QS), Verwalten (Management)", correct: true },
      { t: "Planen, Spezifizieren, Testen, Debuggen, Dokumentieren, Ausliefern", correct: false },
      { t: "Anforderungserhebung, Objektmodellierung, Architektur, Konstruktion, Wartung, Abnahme", correct: false }
    ]
  },
  {
    q: "2. Was besagt das „magische Dreieck“ der Softwareentwicklung?",
    type: "single",
    options: [
      { t: "Hohe Qualität, großer Umfang sowie niedrige Kosten/geringer Zeitaufwand lassen sich nicht gleichzeitig maximieren.", correct: true },
      { t: "Kunde, Benutzer und Entwickler müssen sich immer einig sein.", correct: false },
      { t: "Es beschreibt die drei Phasen Anforderung, Entwurf, Implementierung als gleichseitiges Dreieck.", correct: false },
      { t: "Es zeigt, dass Prinzip, Methode und Verfahren zusammen ein Werkzeug ergeben.", correct: false }
    ]
  },
  {
    q: "3. Warum werden Kosten und Zeitaufwand im magischen Dreieck zu einer Ecke zusammengefasst?",
    type: "single",
    options: [
      { t: "Weil man durch mehr Entwickler:innen ein Projekt beliebig schneller fertigstellen kann, was die Kosten unverändert lässt.", correct: false },
      { t: "Weil beide eng gekoppelt sind: mehr Personal senkt zwar potentiell die Zeit, treibt aber durch Koordinationsaufwand die Kosten überproportional — Zeit lässt sich nicht beliebig gegen Geld eintauschen.", correct: true },
      { t: "Weil Zeitaufwand in der Softwaretechnik generell keine Rolle spielt.", correct: false },
      { t: "Weil beide ausschließlich von der Qualität abhängen.", correct: false }
    ]
  },
  {
    q: "4. Nach Brooks ('No Silver Bullet'): Was unterscheidet 'Essence' von 'Accidents' bei der Schwierigkeit von Softwareentwicklung?",
    type: "single",
    options: [
      { t: "Accidents sind die eigentlichen konzeptuellen Schwierigkeiten (Datensätze, Algorithmen), Essence die Darstellungsprobleme in einer Programmiersprache.", correct: false },
      { t: "Essence ist die dem Konstrukt selbst innewohnende, nicht wegoptimierbare Schwierigkeit; Accidents sind Schwierigkeiten der Darstellung/Umsetzung, die man technisch reduzieren kann.", correct: true },
      { t: "Beide Begriffe sind Synonyme für den gleichen Sachverhalt.", correct: false },
      { t: "Accidents betreffen nur Managementfehler, Essence nur Programmierfehler.", correct: false }
    ]
  },
  {
    q: "5. Welche vier Eigenschaften zählt Brooks zur Essenz von Software, die erklären, warum es keine „Silver Bullet“ gibt?",
    type: "multi",
    options: [
      { t: "Complexity", correct: true },
      { t: "Conformity", correct: true },
      { t: "Changeability", correct: true },
      { t: "Invisibility", correct: true }
    ]
  },
  {
    q: "6. Was ist mit 'Conformity' als Essenz-Eigenschaft von Software gemeint?",
    type: "single",
    options: [
      { t: "Software muss sich an von Menschen/Institutionen willkürlich festgelegte Schnittstellen anpassen, statt an einheitliche Naturgesetze wie in der Physik.", correct: true },
      { t: "Software besteht aus ungewöhnlich vielen, kaum wiederholten Einzelteilen.", correct: false },
      { t: "Software hat keine natürliche geometrische Darstellung.", correct: false },
      { t: "Software wird häufiger geändert als andere gefertigte Produkte.", correct: false }
    ]
  },
  {
    q: "7. Was ist die zentrale Kernaussage von 'No Silver Bullet'?",
    type: "single",
    options: [
      { t: "Objektorientierte Programmierung löst alle wesentlichen Schwierigkeiten der Softwareentwicklung.", correct: false },
      { t: "Es gibt keine einzelne Technik oder Management-Methode, die Softwareproduktivität/-qualität um eine Größenordnung verbessert, weil die Kernschwierigkeiten in der Essenz liegen.", correct: true },
      { t: "Mit genügend Rechenleistung verschwinden alle Essenz-Probleme von selbst.", correct: false },
      { t: "Rapid Prototyping ist überflüssig, da Kund:innen ihre Anforderungen immer vollständig im Voraus kennen.", correct: false }
    ]
  },
  {
    q: "8. Was unterscheidet eine Klasse von einem Objekt (Exemplar)?",
    type: "single",
    options: [
      { t: "Eine Klasse ist eine konkrete Instanz, ein Objekt die abstrakte Beschreibung davon.", correct: false },
      { t: "Eine Klasse beschreibt gemeinsame Struktur/Verhalten (Attribute, Operationen) einer Menge möglicher Objekte; ein Objekt (Exemplar) ist eine konkrete Instanz davon mit eigenen Attributwerten.", correct: true },
      { t: "Klasse und Objekt sind in der Softwaretechnik synonym verwendbar.", correct: false },
      { t: "Eine Klasse existiert nur zur Laufzeit, ein Objekt nur zur Entwurfszeit.", correct: false }
    ]
  },
  {
    q: "9. Was ist der Unterschied zwischen 'Operation' und 'Methode'?",
    type: "single",
    options: [
      { t: "Operation ist die Spezifikation/Schnittstelle (was aufgerufen werden kann), Methode ist deren konkrete Implementierung (wie es umgesetzt ist).", correct: true },
      { t: "Operation und Methode sind völlig unabhängige Konzepte ohne Bezug zueinander.", correct: false },
      { t: "Eine Methode gehört zur Klasse, eine Operation nur zum Objekt.", correct: false },
      { t: "Operation bezeichnet nur private, Methode nur öffentliche Funktionalität.", correct: false }
    ]
  },
  {
    q: "10. Was bedeutet Vererbung?",
    type: "single",
    options: [
      { t: "Ein Objekt gibt zur Laufzeit seine Attributwerte an ein anderes Objekt weiter.", correct: false },
      { t: "Eine Klasse übernimmt Struktur und Verhalten (Attribute, Operationen) einer anderen (allgemeineren) Klasse und kann sie erweitern/spezialisieren.", correct: true },
      { t: "Eine Bibliothek stellt ihre Implementierung für andere Programme bereit.", correct: false },
      { t: "Zwei Objekte derselben Klasse teilen sich denselben Speicherbereich.", correct: false }
    ]
  },
  {
    q: "11. Wie hängen Spezifikation, Implementierung und Verifikation zusammen?",
    type: "single",
    options: [
      { t: "Spezifikation legt fest, was ein System/Modul leisten soll; Implementierung setzt dies um; Verifikation prüft, ob die Implementierung die Spezifikation tatsächlich erfüllt.", correct: true },
      { t: "Verifikation legt fest, was gebaut werden soll, Spezifikation prüft das Ergebnis.", correct: false },
      { t: "Implementierung und Spezifikation sind austauschbare Begriffe für den Quellcode.", correct: false },
      { t: "Verifikation ist nur bei objektorientierten Programmen nötig.", correct: false }
    ]
  },
  {
    q: "12. Was ist der Unterschied zwischen analytischer und konstruktiver Qualitätssicherung?",
    type: "single",
    options: [
      { t: "Analytische QS ist prozessorientiert und vermeidet Mängel von vornherein, konstruktive QS ist produktorientiert und deckt Mängel im fertigen Produkt auf.", correct: false },
      { t: "Analytische QS ist produktorientiert und deckt konkrete Mängel auf (z. B. Test, Inspektion), konstruktive QS ist prozessorientiert und beugt Mängeln durch das Vorgehen selbst vor.", correct: true },
      { t: "Beide Begriffe bezeichnen exakt dasselbe Vorgehen, nur zu unterschiedlichen Projektphasen.", correct: false },
      { t: "Konstruktive QS findet ausschließlich nach der Auslieferung der Software statt.", correct: false }
    ]
  },
  {
    q: "13. Warum sind Kund:in und Benutzer:in in der Softwaretechnik als unterschiedliche Rollen zu betrachten?",
    type: "single",
    options: [
      { t: "Weil Kund:innen das Geld geben, aber nicht zwangsläufig diejenigen sind, die die Software später einsetzen — ihre Bedürfnisse können auseinanderfallen.", correct: true },
      { t: "Weil Benutzer:innen immer auch die Entwickler:innen der Software sind.", correct: false },
      { t: "Weil es laut Definition der Softwaretechnik nie einen gemeinsamen Kunden für Standardsoftware geben kann.", correct: false },
      { t: "Weil Kund:innen laut Vorlesung nie an der Anforderungserhebung beteiligt sein dürfen.", correct: false }
    ]
  },
  {
    q: "14. Welche Aussage zu externer und interner Qualität von Software trifft zu?",
    type: "single",
    options: [
      { t: "Externe Qualität (z. B. Benutzbarkeit, Verlässlichkeit) betrifft die Benutzersicht; interne Qualität (z. B. Wartbarkeit, Effizienz) betrifft die Entwicklersicht — interne Qualität ist Mittel zum Zweck für die externe.", correct: true },
      { t: "Interne Qualität ist für den Erfolg von Software bedeutungslos, nur externe Qualität zählt.", correct: false },
      { t: "Externe Qualität bezieht sich auf den Quellcode, interne Qualität auf die Benutzeroberfläche.", correct: false },
      { t: "Beide Qualitätsarten sind identisch definiert und nur historisch unterschiedlich benannt.", correct: false }
    ]
  }
];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const form = document.getElementById("quiz");
questions.forEach((item, qi) => {
  const div = document.createElement("div");
  div.className = "q";
  div.id = "q" + qi;
  const p = document.createElement("p");
  p.className = "question";
  p.textContent = item.q;
  if (item.type === "multi") {
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = " (mehrere Antworten möglich)";
    p.appendChild(hint);
  }
  div.appendChild(p);

  shuffle(item.options).forEach((opt, oi) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = item.type === "multi" ? "checkbox" : "radio";
    input.name = "q" + qi;
    input.value = oi;
    input.dataset.correct = opt.correct;
    label.appendChild(input);
    label.appendChild(document.createTextNode(" " + opt.t));
    div.appendChild(label);
  });

  form.appendChild(div);
});

function check() {
  let correctCount = 0;
  questions.forEach((item, qi) => {
    const div = document.getElementById("q" + qi);
    div.classList.remove("correct", "wrong");
    const inputs = [...div.querySelectorAll("input")];
    const allMatch = inputs.every(input => input.checked === (input.dataset.correct === "true"));
    div.querySelectorAll("label").forEach(l => {
      const input = l.querySelector("input");
      if (input.dataset.correct === "true") l.classList.add("answer-correct");
    });
    if (allMatch) {
      correctCount++;
      div.classList.add("correct");
    } else {
      div.classList.add("wrong");
    }
  });
  document.getElementById("score").textContent = `${correctCount} / ${questions.length} richtig`;
}
</script>
</body>
</html>
